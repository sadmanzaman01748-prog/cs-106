
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Purrfect Cat Cafe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav class="navbar">
      <h2>🐾 Purrfect Cafe</h2>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="booking.html">Book Now</a></li>
        <li><a href="auth.html">Sign In</a></li>
      </ul>
    </nav>
  </header>

  <section class="auth-section">
    <div class="auth-box">

      <h1>🐱 Welcome!</h1>
      <p>Join our Purrfect Cat Cafe family</p>

      <div class="auth-tabs">
        <button id="loginTab" class="active"
                onclick="showLogin()">Sign In</button>
        <button id="signupTab"
                onclick="showSignup()">Sign Up</button>
      </div>

      <!-- Sign In Form -->
      <form id="loginForm">
        <h2>Sign In</h2>

        <label>Email Address</label>
        <input type="email" id="loginEmail"
               placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" id="loginPassword"
               placeholder="Enter your password" required>

        <button type="submit" class="auth-btn">
          Sign In
        </button>

        <p class="switch-text">
          Don't have an account?
          <a href="#" onclick="showSignup(); return false;">
            Sign Up
          </a>
        </p>
      </form>

      <!-- Sign Up Form -->
      <form id="signupForm" class="hidden">
        <h2>Create Account</h2>

        <label>Full Name</label>
        <input type="text" id="fullName"
               placeholder="Enter your full name" required>

        <label>Email Address</label>
        <input type="email" id="signupEmail"
               placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" id="signupPassword"
               placeholder="Create a password"
               minlength="8" required>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword"
               placeholder="Confirm your password" required>

        <button type="submit" class="auth-btn">
          Create Account
        </button>

        <p class="switch-text">
          Already have an account?
          <a href="#" onclick="showLogin(); return false;">
            Sign In
          </a>
        </p>
      </form>

      <p id="authMessage" role="status"></p>

    </div>
  </section>

  <footer>
    <p>&copy; 2026 Purrfect Cat Cafe</p>
  </footer>


</body>
</html>
