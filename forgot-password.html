<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Purrfect Cat Café</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Same styles as the login page -->
    <link rel="stylesheet" href="login.css">

    <style>
        /* green "it worked" message (errors reuse the login page's red box) */
        #formSuccess {
            color: #1E7B3A;
            background-color: #EAF7EE;
            border: 1px solid #BFE3C9;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 12px;
            text-align: center;
            margin-top: 15px;
        }
        #formSuccess:empty { display: none; }
        .reset-intro { font-size: 13px; color: #6b5d52; text-align: center; margin: 8px 0 18px; }
    </style>
</head>

<body>

    <header class="login-header">
        <a href="login.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Login
        </a>
        <a href="index.html" class="login-logo">
            <i class="fa-solid fa-paw"></i>
            <span>Purrfect Café</span>
        </a>
    </header>

    <main class="login-container">
        <div class="login-card">

            <div class="login-heading">
                <div class="small-logo">
                    <i class="fa-solid fa-cat"></i>
                    <span>PURRFECT CAT CAFÉ</span>
                </div>
                <h1>Forgot Password?</h1>
            </div>

            <p class="reset-intro">Enter your email and we'll send you a link to choose a new password.</p>

            <form id="forgotForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-at input-icon"></i>
                        <input type="email" id="email" name="email"
                               placeholder="example@gmail.com" required>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="sendBtn">
                    Send Reset Link
                    <i class="fa-solid fa-paper-plane"></i>
                </button>

                <p id="loginError" role="alert" aria-live="polite"></p>
                <p id="formSuccess" role="status" aria-live="polite"></p>
            </form>

            <a href="login.html" class="return-home">
                <i class="fa-solid fa-right-to-bracket"></i>
                Back to Login
            </a>
        </div>
    </main>

    <footer class="login-footer">
        <p>© 2026 Purrfect Cat Café. Crafted with warm paws &amp; fresh brew.</p>
    </footer>

    <!-- Supabase Library, then the backend helpers -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        // FORGOT PASSWORD: ask Supabase to email a reset link

        const forgotForm = document.getElementById("forgotForm");
        const errorBox = document.getElementById("loginError");
        const successBox = document.getElementById("formSuccess");
        const sendBtn = document.getElementById("sendBtn");

        forgotForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            errorBox.textContent = "";
            successBox.textContent = "";

            if (!email) {
                errorBox.textContent = "Please enter your email address.";
                return;
            }

            sendBtn.disabled = true;

            try {
                // The link in the email opens reset-password.html (same folder as this page)
                const resetPage = new URL("reset-password.html", window.location.href).href;

                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: resetPage
                });
                if (error) throw error;

                // Same message whether or not the email has an account,
                // so nobody can use this page to check who is a member.
                successBox.textContent =
                    "If that email has an account, a reset link is on its way. Please check your inbox (and spam folder).";
                forgotForm.reset();

            } catch (error) {
                errorBox.textContent = error.message || "Could not send the reset email. Please try again.";
            } finally {
                sendBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
