
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Purrfect Cat Café</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Login CSS -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Top Navigation -->
    <header class="login-header">

        <a href="index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>

        <a href="index.html" class="login-logo">
            <i class="fa-solid fa-paw"></i>
            <span>Purrfect Café</span>
        </a>

    </header>


    <!-- Main Login Section -->
    <main class="login-container">

        <div class="login-card">

            <!-- Card Heading -->
            <div class="login-heading">

                <div class="small-logo">
                    <i class="fa-solid fa-cat"></i>
                    <span>PURRFECT CAT CAFÉ</span>
                </div>

                <h1>Welcome Back!</h1>

                

            </div>


            <!-- Login Form -->
            <form id="loginForm">

                <!-- Email Field -->
                <div class="form-group">

                    <label for="email">Email Address</label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-at input-icon"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@gmail.com"
                            required>

                    </div>

                </div>


                <!-- Password Field -->
                <div class="form-group">

                    <div class="password-heading">

                        <label for="password">Password</label>

                        <a href="forgot-password.html">
                            Forgot Password?
                        </a>

                    </div>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock input-icon"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- Remember Me -->
                <div class="remember-row">

                    <label class="remember-label">

                        <input type="checkbox" id="rememberMe">

                        <span>Remember me for 30 days</span>

                    </label>

                    <span class="protected-badge">
                        <i class="fa-solid fa-shield-halved"></i>
                        Protected
                    </span>

                </div>


                <!-- Login Button -->
                <button type="submit" class="login-btn">
                    Log In to Sanctuary
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>


            <!-- Sign Up Link -->
            <div class="signup-text">

                <p>
                    Don't have an account?
                    <a href="signup.html">Sign Up</a>
                </p>

            </div>


            <!-- Return Home -->
            <a href="index.html" class="return-home">
                <i class="fa-solid fa-house"></i>
                Return to Café Home Page
            </a>

        </div>

    </main>


    <!-- Footer -->
    <footer class="login-footer">
        <p>© 2024 Purrfect Cat Café. Crafted with warm paws &amp; fresh brew.</p>
    </footer>


    <!-- JavaScript -->
    <script>

        // Show and Hide Password

        const passwordInput = document.getElementById("password");

        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                togglePassword.innerHTML =
                    '<i class="fa-solid fa-eye-slash"></i>';

                togglePassword.setAttribute("aria-label", "Hide password");

            } else {

                passwordInput.type = "password";

                togglePassword.innerHTML =
                    '<i class="fa-solid fa-eye"></i>';

                togglePassword.setAttribute("aria-label", "Show password");

            }

        });


        // Login Form Submission

        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", function (event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();

            const password = passwordInput.value;

            if (email === "" || password === "") {

                alert("Please enter your email and password.");

                return;

            }

            alert("Login form submitted! Connect your backend to verify your account.");

        });

    </script>

</body>
</html>
