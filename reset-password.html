<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose a New Password | Purrfect Cat Café</title>

    <!-- Remember the link details before Supabase tidies them out of the address bar -->
    <script>window.resetLinkText = window.location.hash + window.location.search;</script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Same styles as the login page -->
    <link rel="stylesheet" href="login.css">

    <style>
        /* green "it worked" message (errors reuse the login page's red box) */
        #formSuccess {
            color: #1E7B3A;
            background-color: #EAF7EE;
            border: 1px solid #BFE3C9;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 12px;
            text-align: center;
            margin-top: 15px;
        }
        #formSuccess:empty { display: none; }
        .reset-intro { font-size: 13px; color: #6b5d52; text-align: center; margin: 8px 0 18px; }
    </style>
</head>

<body>

    <header class="login-header">
        <a href="login.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Login
        </a>
        <a href="index.html" class="login-logo">
            <i class="fa-solid fa-paw"></i>
            <span>Purrfect Café</span>
        </a>
    </header>

    <main class="login-container">
        <div class="login-card">

            <div class="login-heading">
                <div class="small-logo">
                    <i class="fa-solid fa-cat"></i>
                    <span>PURRFECT CAT CAFÉ</span>
                </div>
                <h1>Choose a New Password</h1>
            </div>

            <p class="reset-intro" id="resetIntro">Checking your reset link...</p>

            <form id="resetForm" hidden>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="newPassword" name="newPassword"
                               placeholder="At least 8 characters" minlength="8"
                               autocomplete="new-password" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword"
                               placeholder="Type it again" minlength="8"
                               autocomplete="new-password" required>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="saveBtn">
                    Save New Password
                    <i class="fa-solid fa-check"></i>
                </button>
            </form>

            <p id="loginError" role="alert" aria-live="polite"></p>
            <p id="formSuccess" role="status" aria-live="polite"></p>

            <div class="signup-text" id="tryAgain" hidden>
                <p>
                    Need a new link?
                    <a href="forgot-password.html">Send another reset email</a>
                </p>
            </div>

            <a href="login.html" class="return-home">
                <i class="fa-solid fa-right-to-bracket"></i>
                Back to Login
            </a>
        </div>
    </main>

    <footer class="login-footer">
        <p>© 2026 Purrfect Cat Café. Crafted with warm paws &amp; fresh brew.</p>
    </footer>

    <!-- Supabase Library, then the backend helpers -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        // RESET PASSWORD: the emailed link signs the user in for a moment,
        // then this page lets them save a new password.

        const resetForm = document.getElementById("resetForm");
        const resetIntro = document.getElementById("resetIntro");
        const errorBox = document.getElementById("loginError");
        const successBox = document.getElementById("formSuccess");
        const tryAgain = document.getElementById("tryAgain");
        const saveBtn = document.getElementById("saveBtn");

        function showBadLink() {
            resetIntro.textContent = "";
            errorBox.textContent =
                "This reset link is not valid or has expired. Reset links can only be used once.";
            tryAgain.hidden = false;
        }

        async function checkLink() {
            try {
                // Supabase puts "error" in the link when it has expired or was already used
                if ((window.resetLinkText || "").includes("error")) {
                    showBadLink();
                    return;
                }

                // A good link logs the user in. No session means no valid link.
                const { data, error } = await supabaseClient.auth.getSession();
                if (error || !data.session) {
                    showBadLink();
                    return;
                }

                resetIntro.textContent = "Type your new password twice to confirm it.";
                resetForm.hidden = false;

            } catch (error) {
                showBadLink();
            }
        }

        resetForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            errorBox.textContent = "";
            successBox.textContent = "";

            if (newPassword.length < 8) {
                errorBox.textContent = "Your password needs at least 8 characters.";
                return;
            }
            if (newPassword !== confirmPassword) {
                errorBox.textContent = "The two passwords do not match.";
                return;
            }

            saveBtn.disabled = true;

            try {
                const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
                if (error) throw error;

                resetForm.hidden = true;
                resetIntro.textContent = "";
                successBox.textContent = "Password changed! Taking you to your dashboard...";

                setTimeout(function () {
                    window.location.replace("customerDashboard.html");
                }, 2000);

            } catch (error) {
                errorBox.textContent = error.message || "Could not save the new password.";
                saveBtn.disabled = false;
            }
        });

        checkLink();
    </script>

</body>
</html>
